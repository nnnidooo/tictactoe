<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Tic-Tac-Toe</h1>

    <section class="scoreboard" aria-label="Score">
      <div class="score score-x"><span class="label">X</span><span class="value" id="score-x">0</span></div>
      <div class="score score-draw"><span class="label">Draws</span><span class="value" id="score-draw">0</span></div>
      <div class="score score-o"><span class="label">O</span><span class="value" id="score-o">0</span></div>
    </section>

    <p class="status" id="status" aria-live="polite">X to move</p>

    <div class="board" id="board" role="grid" aria-label="Tic-tac-toe board">
      <button class="cell" data-index="0" aria-label="Row 1, column 1, empty"></button>
      <button class="cell" data-index="1" aria-label="Row 1, column 2, empty"></button>
      <button class="cell" data-index="2" aria-label="Row 1, column 3, empty"></button>
      <button class="cell" data-index="3" aria-label="Row 2, column 1, empty"></button>
      <button class="cell" data-index="4" aria-label="Row 2, column 2, empty"></button>
      <button class="cell" data-index="5" aria-label="Row 2, column 3, empty"></button>
      <button class="cell" data-index="6" aria-label="Row 3, column 1, empty"></button>
      <button class="cell" data-index="7" aria-label="Row 3, column 2, empty"></button>
      <button class="cell" data-index="8" aria-label="Row 3, column 3, empty"></button>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="new-round">New round</button>
      <button class="btn" id="reset-score">Reset score</button>
    </div>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
